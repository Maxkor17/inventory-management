<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>IT Asset Management</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f5bea'/%3E%3Cpath d='M9 11h14M9 16h14M9 21h9' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <script>
    // Apply saved theme before first paint (avoids a light/dark flash).
    try {
      var p = JSON.parse(localStorage.getItem('itam.prefs') || '{}');
      if (p.theme === 'light' || p.theme === 'dark') document.documentElement.dataset.theme = p.theme;
      if (p.lang === 'uk' || p.lang === 'en') document.documentElement.lang = p.lang;
    } catch (e) { /* ignore */ }
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>This application requires JavaScript.</noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
